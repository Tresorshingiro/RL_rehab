[project]
name = "rehab-coach-rl"
version = "0.1.0"
description = "Adaptive Home Rehab Coach: DQN, REINFORCE, PPO and A2C with TorchRL"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.15.0",
    "torchrl==0.15.0",
    "tensordict==0.15.6",
    "gymnasium==1.4.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "pygame==2.6.1",
    "pyopengl==3.1.10",
    "fastapi==0.163.2",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.uv]
package = false          # plain application: no build step, run files directly

[tool.pytest.ini_options]
pythonpath = ["."]       # lets tests import `environment` and `training`
testpaths = ["tests"]